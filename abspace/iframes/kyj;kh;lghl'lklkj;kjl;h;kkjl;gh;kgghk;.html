<html>

<style>
    
    span.quest {font-weight: bold;}
    label {margin-left: 15px;}
    .nav {font-size: 16px;}
    body {
        
        color: rgb(rgb(255, 255, 255));
        color: rgb(255, 255, 255);
        font-size: 16px;
      }
      div:nth-child(1) {
        font-family: 'Pangolin', serif;
      }
      div:nth-child(2) {
        font-family: 'Pangolin', serif;

      a {
    color: rgb(212, 224, 252); /* Цвет текста */
/* Стили всплывающего окна по-умолчанию */
.modal {
    position: fixed; /* фиксированное положение */
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    background: rgba(0,0,0,0.5); /* фон */
    z-index: 1050;
    opacity: 0; /* по умолчанию модальное окно прозрачно */
    -webkit-transition: opacity 200ms ease-in; 
    -moz-transition: opacity 200ms ease-in;
    transition: opacity 200ms ease-in; /* анимация перехода */
    pointer-events: none; /* элемент невидим для событий мыши */
    margin: 0;
    padding: 0;
}
/* При отображении модального окно */
.modal:target {
    opacity: 1; /* делаем окно видимым */
	  pointer-events: auto; /* элемент видим для событий мыши */
    overflow-y: auto; /* добавляем прокрутку по y, когда элемент не помещается на страницу */
}
/* ширина модального окна и его отступы от экрана */
.modal-dialog {
    position: relative;
    width: auto;
    margin: 10px;
}
@media (min-width: 576px) {
  .modal-dialog {
      max-width: 500px;
      margin: 30px auto; /* отображение окна по центру */
  }
}
/* Стили для блока с контентом окна */ 
.modal-content {
    position: relative;
    display: -webkit-box;
    display: -webkit-flex;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-box-direction: normal;
    -webkit-flex-direction: column;
    -ms-flex-direction: column;
    flex-direction: column;
    background-color: #fff;
    -webkit-background-clip: padding-box;
    background-clip: padding-box;
    border: 1px solid rgba(0,0,0,.2);
    border-radius: .3rem;
    outline: 0;
}
@media (min-width: 768px) {
  .modal-content {
      -webkit-box-shadow: 0 5px 15px rgba(0,0,0,.5);
      box-shadow: 0 5px 15px rgba(0,0,0,.5);
  }
}
/* Стили заголовка окна */
.modal-header {
    display: -webkit-box;
    display: -webkit-flex;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: justify;
    -webkit-justify-content: space-between;
    -ms-flex-pack: justify;
    justify-content: space-between;
    padding: 15px;
    border-bottom: 1px solid #eceeef;
}
.modal-title {
    margin-top: 0;
    margin-bottom: 0;
    line-height: 1.5;
    font-size: 1.25rem;
    font-weight: 500;
}
/* Стили кнопки "х" ("Закрыть")  */
.close {
    float: right;
    font-family: sans-serif;
    font-size: 24px;
    font-weight: 700;
    line-height: 1;
    color: #000;
    text-shadow: 0 1px 0 #fff;
    opacity: .5;
    text-decoration: none;
}
/* Стили для закрывающей кнопки в фокусе или наведении */
.close:focus, .close:hover {
    color: #000;
    text-decoration: none;
    cursor: pointer;
    opacity: .75;
}
/* Стили блока основного содержимого окна */
.modal-body {
  position: relative;
    -webkit-box-flex: 1;
    -webkit-flex: 1 1 auto;
    -ms-flex: 1 1 auto;
    flex: 1 1 auto;
    padding: 15px;
    overflow: auto;
}
 button {
  appearance: none;
  border: 0;

  background: #4676D7;
  color: #fff;
  padding: 8px 16px;
  font-size: 16px;
}

<body>
<div >
    <div style="display:flex; justify-content: space-between;">
    </div>
<script>
// Заголовок страницы (h2)
var title = 'Марс - Тест';
// Подзаголовок (h3)
var subtitle = "Этот тест позволяет оценить Ваши знания";
// Это ваши вопросы
var questions=[
{
	text: "Сколько спутников у Марса?",
	answers: ["2",
		  "3",
		  "6"
        ],
	correctAnswer: 0 // нумерация ответов с нуля!
},
{
	text: "На какой планете находится самый большой вулкан Солнечной системы, называемый “Гора Олимп”?",
	answers: ["Венера",
		  "Марс",
		  "Юпитер"],
	correctAnswer: 1
},
{
	text: "Какая планета ближе всех расположена к Солнцу?",
	answers: ["Меркурий",
		  "Венера",
		  "Земля"],
	correctAnswer: 0
},
{
	text: "Что такое Большое Красное Пятно на Юпитере?",
	answers: ["самый большой атмосферный вихрь в Солнечной системе.",
		  "след большого метеорита",
		  "результат столкновения с кольцом"],
	correctAnswer: 0
},
{
	text: "К какой планете принадлежат спутники Оберон и Титания?",
	answers: ["Венера",
		  "Марс",
		  "Уран"],
	correctAnswer: 2
},
{
	text: "Как можно описать атмосферу, окружающую Венеру?",
	answers: ["Венера не окружена облаками, поэтому атмосфера там холодная и безопасная.",
		  "Венера окружена кислотными облаками, поэтому атмосфера там горячая и ядовитая.",
		  "У Венеры нет атмосферы."],
	correctAnswer: 1
},
{
	text: "Где находится пояс астероидов?",
	answers: ["Между Марсом и Юпитером",
		  "Между Венерой и Марсом",
		  "Между Венерой и Меркурием"],
	correctAnswer: 0
},
{
	text: "Какая из этих планет самая маленькая?",
	аanswers: ["Марс",
		  "Венера",
		  "Меркурий"],
	correctAnswer: 0
}

];

var yourAns = new Array;
var score = 0;

function Engine(question, answer) {yourAns[question]=answer;}

function Score(){
   var answerText = "Результаты:\n";
   for(var i = 0; i < yourAns.length; ++i){
	var num = i+1;
	answerText=answerText+"\n    Вопрос №"+ num +"";
	if(yourAns[i]!=questions[i].correctAnswer){
	    answerText=answerText+"\n    Правильный ответ: " +
		questions[i].answers[questions[i].correctAnswer] + "\n";
	  }
        else{
	    answerText=answerText+": Верно! \n";
	    ++score;
	    }
       }

   answerText=answerText+"\nВсего правильных ответов: "+score+"\n";

   alert(answerText);
   var link = '/abspace/css/rate' + score + '.html'
    window.location.replace(link); // поморогнитетрьорпо
   yourAns = [];
   score = 0;
   clearForm("quiz");
}
function clearForm(name) {
   var f = document.forms[name];
   for(var i = 0; i < f.elements.length; ++i) {
	if(f.elements[i].checked)
		f.elements[i].checked = false;
}
}
</script>
<h2><script>document.write(title)</script></h2>
<h3><script>document.write(subtitle)</script></h3>

    <form name="quiz">
    <ol>
        <script>
        for(var q=0; q<questions.length; ++q) {
           var question = questions[q];
           var idx = 1 + q;

           document.writeln('<li><span class="quest">' + question.text + '</span><br>');
           for(var i in question.answers) {
            document.writeln('<label><input type=radio name="q' + idx + '" value="' + i +
            '" onClick="Engine(' + q + ', this.value)"> ' + question.answers[i] + '</label><br>');
        }
            document.writeln('</li>');
        }
        </script>
    </ol>
        <br>
        <button onClick="Score()" value="Проверить результаты">
            Проверить результаты
            </button>
    </form>

</div>
