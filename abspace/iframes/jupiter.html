<script>
// Заголовок страницы (h2)
var title = 'Марс - Тест';
// Подзаголовок (h3)
var subtitle = "Этот тест позволяет оценить Ваши знания";
// Это ваши вопросы
var questions=[
{
	text: "Какова скорость вращения Юпитера вокруг своей оси?",
	answers: ["около 100 000 километров в час",
		  "около 50 000 километров в час",
		  "около 60 000 километров в час"
        ],
	correctAnswer: 1 // нумерация ответов с нуля!
},
{
	text: "Как выглядит Юпитер невооружённым глазом?",
	answers: ["малая, тёмная звезда чёрного или желтовато-чёрного цвета",
		  "крупная, яркая звезда белого или желтовато-белого цвета",
		  "газовый гигант, покрытый клубящимися облаками."],
	correctAnswer: 1
},
{
	text: "Насколько сильно магнитное поле Юпитера?",
	answers: ["5,6 гаусса",
		  "2,1 гаусса",
		  "4,3 гаусса"],
	correctAnswer: 2
},
{
	text: "Что такое Большое Красное Пятно на Юпитере?",
	answers: ["самый большой атмосферный вихрь в Солнечной системе.",
		  "след большого метеорита",
		  "результат столкновения с кольцом"],
	correctAnswer: 0
},
{
	text: "Почему Юпитер назвали в честь римского бога?",
	answers: ["Марс-2",
		  "ПрОП-М",
		  "в честь главного бога древнеримской мифологии Юпитера. "],
	correctAnswer: 2
},
{
	text: "Какова средняя температура Марса?",
	answers: ["-60°С",
		  "-90°С",
		  "-70°С"],
	correctAnswer: 0
},
{
	text: "Каков радиус Марса?",
	answers: ["3,39×10³",
		  "4,40×10³",
		  "2,59×10³"],
	correctAnswer: 2
},
{
	text: "Из чего в основном состоит атмосфера Марса?",
	аanswers: [" из кислород",
		  " из углекислого газа",
		  " из азота"],
	correctAnswer: 1
}

];

var yourAns = new Array;
var score = 0;

function Engine(question, answer) {yourAns[question]=answer;}

function Score(){
   var answerText = "Результаты:\n";
   for(var i = 0; i < yourAns.length; ++i){
	var num = i+1;
	answerText=answerText+"\n    Вопрос №"+ num +"";
	if(yourAns[i]!=questions[i].correctAnswer){
	    answerText=answerText+"\n    Правильный ответ: " +
		questions[i].answers[questions[i].correctAnswer] + "\n";
	  }
        else{
	    answerText=answerText+": Верно! \n";
	    ++score;
	    }
       }

   answerText=answerText+"\nВсего правильных ответов: "+score+"\n";

   alert(answerText);
   if(score>7){
	    alert('Запомни этот код и запиши его куда-нибудь, он тебе понадобится - 445821')
	  }
   yourAns = [];
   score = 0;
   clearForm("quiz");
}
function clearForm(name) {
   var f = document.forms[name];
   for(var i = 0; i < f.elements.length; ++i) {
	if(f.elements[i].checked)
		f.elements[i].checked = false;
}
}
</script>
<h2><script>document.write(title)</script></h2>
<h3><script>document.write(subtitle)</script></h3>

    <form name="quiz">
    <ol>
        <script>
        for(var q=0; q<questions.length; ++q) {
           var question = questions[q];
           var idx = 1 + q;

           document.writeln('<li><span class="quest">' + question.text + '</span><br>');
           for(var i in question.answers) {
            document.writeln('<label><input type=radio name="q' + idx + '" value="' + i +
            '" onClick="Engine(' + q + ', this.value)"> ' + question.answers[i] + '</label><br>');
        }
            document.writeln('</li>');
        }
        </script>
    </ol>
        <br>
        <button onClick="Score()" value="Проверить результаты">
            Проверить результаты
            </button>
    </form>
